[package]
name = "laap-desktop-core"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "laap_desktop_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "laap-desktop-core"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"], optional = true }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3"], optional = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
quick-xml = "0.41"
xmltree = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
keyring = { version = "4", default-features = false, features = ["v1"] }
rand = "0.10"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
minisign-verify = "0.3"
tauri-plugin-dialog = { version = "2.8.4", optional = true }
sevenz-rust2 = { version = "0.25.0", default-features = false }

[dev-dependencies]
ltk_wad = "=0.5.13"
ltk_meta = "=0.9.4"
ltk_hash = "=0.5.4"

[features]
basic = []
studio = ["customization"]
customization = ["dep:zip", "dep:tauri-plugin-dialog", "dep:symphonia", "dep:flate2", "dep:zstd", "dep:xxhash-rust"]
default = ["custom-protocol", "customization"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"]
