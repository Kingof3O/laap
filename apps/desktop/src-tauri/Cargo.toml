[package]
name = "laap-desktop-core"
version = "0.4.6"
edition = "2021"
publish = false

[lib]
name = "laap_desktop_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "laap-desktop-core"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
quick-xml = "0.41"
xmltree = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
keyring = { version = "4", default-features = false }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native"] }
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native"] }
winreg = "0.55"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"]
