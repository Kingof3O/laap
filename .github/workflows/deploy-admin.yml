name: Deploy admin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://laap-api.hussiensalah100.workers.dev' }}
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountName: ${{ secrets.CLOUDFLARE_ACCOUNT_NAME }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: apps/admin/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
