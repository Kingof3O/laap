name: Release desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            edition: team
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            edition: offline
            args: '--target universal-apple-darwin --config src-tauri/tauri.offline.conf.json'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            edition: team
            args: ''
            targets: ''
          - platform: windows-latest
            edition: offline
            args: '--config src-tauri/tauri.offline.conf.json'
            targets: ''
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci --workspace @laap/desktop --include-workspace-root

      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'LAAP Desktop ${{ github.ref_name }}'
          releaseBody: |
            Official LAAP Desktop release.
            
            - **LAAP Desktop**: Full Team Edition (Shared Accounts + Personal Roster).
            - **LAAP Offline**: Community Standalone Edition (100% local Personal Roster, zero network).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.edition }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
