name: Release desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

jobs:
  signing-release-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag for SignPath release publication
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          if [[ "$SIGNPATH_ENABLED" == true && ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'SignPath release publication requires a version tag.' >&2
            exit 1
          fi

  release:
    needs: signing-release-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            edition: team
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            edition: offline
            args: '--target universal-apple-darwin --config src-tauri/tauri.offline.conf.json'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            edition: team
            args: ''
            targets: ''
          - platform: windows-latest
            edition: offline
            args: '--config src-tauri/tauri.offline.conf.json'
            targets: ''
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci --workspace @laap/desktop --include-workspace-root

      - uses: tauri-apps/tauri-action@v0.5
        if: runner.os != 'Windows' || vars.SIGNPATH_ENABLED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'LAAP Desktop ${{ github.ref_name }}'
          releaseBody: |
            Official LAAP Desktop release.

            [Code signing policy](https://github.com/Kingof3O/laap/blob/main/CODE_SIGNING.md) · [Privacy policy](https://github.com/Kingof3O/laap/blob/main/PRIVACY.md)

            - **LAAP Desktop**: Full Team Edition (Shared Accounts + Personal Roster).
            - **LAAP Offline**: Community Standalone Edition (local Personal Roster; optional icon downloads, opt-in League Client sync, and Windows LAAP Presence).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Archive build artifacts
        if: always() && (runner.os != 'Windows' || vars.SIGNPATH_ENABLED != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.edition }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg

  signpath-windows:
    needs: signing-release-guard
    if: vars.SIGNPATH_ENABLED == 'true'
    uses: ./.github/workflows/signpath-windows.yml
    with:
      sign: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  upload-signpath-windows:
    needs: [release, signpath-windows]
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.signpath-windows.outputs.artifact-id }}
          path: verified-windows
      - name: Upload verified Windows installers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Signed publication requires a version tag.' >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo 'Refusing to replace artifacts in an already published release.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" verified-windows/team/*.exe verified-windows/team/*.msi verified-windows/offline/*.exe verified-windows/offline/*.msi verified-windows/manifest.json --clobber

  publish:
    needs: [release, signpath-windows, upload-signpath-windows]
    if: always() && needs.release.result == 'success' && (vars.SIGNPATH_ENABLED != 'true' || (needs.signpath-windows.result == 'success' && needs.upload-signpath-windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Publish after required builds and signature verification pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
