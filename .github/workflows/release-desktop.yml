name: Release desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

jobs:
  signing-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag, app version, and draft state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release publication requires a version tag.' >&2
            exit 1
          fi
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo 'The release tag does not match the app version.' >&2
            exit 1
          fi
          bash .signpath/assert-draft-release.sh

  release:
    needs: signing-release-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            edition: team
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            edition: offline
            args: '--target universal-apple-darwin --config src-tauri/tauri.offline.conf.json'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            edition: team
            args: ''
            targets: ''
          - platform: windows-latest
            edition: offline
            args: '--config src-tauri/tauri.offline.conf.json'
            targets: ''
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci --workspace @laap/desktop --include-workspace-root

      - name: Confirm release is still a draft before uploading
        if: runner.os != 'Windows' || vars.SIGNPATH_ENABLED != 'true'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .signpath/assert-draft-release.sh

      - uses: tauri-apps/tauri-action@v0.5
        if: runner.os != 'Windows' || vars.SIGNPATH_ENABLED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'LAAP Desktop ${{ github.ref_name }}'
          releaseBody: |
            Official LAAP Desktop release.

            [Code signing policy](https://github.com/Kingof3O/laap/blob/main/CODE_SIGNING.md) · [Privacy policy](https://github.com/Kingof3O/laap/blob/main/PRIVACY.md)

            - **LAAP Desktop**: Full Team Edition (Shared Accounts + Personal Roster).
            - **LAAP Offline**: Community Standalone Edition (local Personal Roster; optional icon downloads, opt-in League Client sync, and Windows/macOS LAAP Presence).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Archive build artifacts
        if: always() && (runner.os != 'Windows' || vars.SIGNPATH_ENABLED != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.edition }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip*
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz*

  signpath-windows:
    needs: signing-release-guard
    if: vars.SIGNPATH_ENABLED == 'true'
    uses: ./.github/workflows/signpath-windows.yml
    with:
      sign: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  upload-signpath-windows:
    needs: [release, signpath-windows]
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.signpath-windows.outputs.artifact-id }}
          path: verified-windows
      - name: Upload verified Windows installers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Signed publication requires a version tag.' >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo 'Refusing to replace artifacts in an already published release.' >&2
            exit 1
          fi
          mapfile -t expected < <(find verified-windows -type f \( -name '*.exe' -o -name '*.msi' \) -printf '%f\n')
          mapfile -t existing < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select((ascii_downcase | endswith(".exe")) or (ascii_downcase | endswith(".msi")))')
          for asset in "${existing[@]}"; do
            if ! printf '%s\n' "${expected[@]}" | grep -Fx -- "$asset" >/dev/null; then
              echo "Unexpected Windows installer already exists in the draft: $asset" >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" verified-windows/team/*.exe verified-windows/team/*.msi verified-windows/offline/*.exe verified-windows/offline/*.msi verified-windows/manifest.json --clobber

  generate-updater-manifests:
    needs: [release, signpath-windows, upload-signpath-windows]
    if: always() && needs.release.result == 'success' && (vars.SIGNPATH_ENABLED != 'true' || (needs.signpath-windows.result == 'success' && needs.upload-signpath-windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @laap/desktop --include-workspace-root
      - name: Download all release assets, sign SignPath payloads if needed, and generate verified manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          version="${RELEASE_TAG#v}"
          # Generate and verify Team edition updater manifest for all advertised platforms
          node scripts/generate-update-manifest.mjs --version "$version" --tag "$RELEASE_TAG" --edition team --artifacts-dir release-assets --output latest-team.json --require-all-platforms --require-verification
          # Generate and verify Offline edition updater manifest for all advertised platforms
          node scripts/generate-update-manifest.mjs --version "$version" --tag "$RELEASE_TAG" --edition offline --artifacts-dir release-assets --output latest-offline.json --require-all-platforms --require-verification
          # Upload verified manifests and any newly signed signatures to the release
          gh release upload "$RELEASE_TAG" latest-team.json latest-offline.json release-assets/*.sig --clobber || gh release upload "$RELEASE_TAG" latest-team.json latest-offline.json --clobber

  publish:
    needs: [release, signpath-windows, upload-signpath-windows, generate-updater-manifests]
    if: always() && needs.release.result == 'success' && needs.generate-updater-manifests.result == 'success' && (vars.SIGNPATH_ENABLED != 'true' || (needs.signpath-windows.result == 'success' && needs.upload-signpath-windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish after required builds and signature verification pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash .signpath/assert-draft-release.sh
          gh release edit "$RELEASE_TAG" --draft=false
