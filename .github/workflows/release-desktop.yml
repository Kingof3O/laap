name: Release desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            edition: team
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            edition: offline
            args: '--target universal-apple-darwin --config src-tauri/tauri.offline.conf.json'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            edition: team
            args: ''
            targets: ''
          - platform: windows-latest
            edition: offline
            args: '--config src-tauri/tauri.offline.conf.json'
            targets: ''
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci --workspace @laap/desktop --include-workspace-root

      - name: Configure optional trusted Windows signing
        id: signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LAAP_WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          if (-not $env:LAAP_WINDOWS_SIGN_COMMAND) {
            Write-Output 'No trusted signing command configured; Windows artifacts will be unsigned.'
            exit 0
          }
          $config = @{ bundle = @{ windows = @{ signCommand = $env:LAAP_WINDOWS_SIGN_COMMAND } } } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $PWD 'src-tauri/tauri.signing.local.json'), $config)
          'args=--config src-tauri/tauri.signing.local.json' >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'LAAP Desktop ${{ github.ref_name }}'
          releaseBody: |
            Official LAAP Desktop release.
            
            - **LAAP Desktop**: Full Team Edition (Shared Accounts + Personal Roster).
            - **LAAP Offline**: Community Standalone Edition (local Personal Roster; optional icon downloads, opt-in League Client sync, and Windows/macOS LAAP Presence).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}

      - name: Verify configured Windows publisher signatures
        if: runner.os == 'Windows' && steps.signing.outputs.args != ''
        shell: pwsh
        run: |
          $files = @((Get-Item src-tauri/target/release/laap-desktop-core.exe)) + @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' })
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw "Missing valid timestamped publisher signature: $($file.Name)" }
          }

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.edition }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg

  publish:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after all builds and signature checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
