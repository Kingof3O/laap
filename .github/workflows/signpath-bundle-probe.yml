name: Verify SignPath packaging samples
on:
  push:
    branches: [codex/signpath-setup]
    paths: ['.github/workflows/signpath-bundle-probe.yml', '.signpath/**']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --workspace @laap/desktop --include-workspace-root
      - run: npm --workspace @laap/desktop run build
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38627799057
          name: signpath-input-applications
          path: .signpath/out/compiled
      - name: Prepare and repackage the actual compiled samples
        shell: pwsh
        run: |
          ./.signpath/windows-artifacts.ps1 -Stage PrepareApplications
          ./.signpath/windows-artifacts.ps1 -Stage BundleInstallers
          ./.signpath/windows-artifacts.ps1 -Stage VerifyInstallers
