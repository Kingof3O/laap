name: Test and build

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm --workspace @laap/desktop run build:offline
      - run: npm --workspace @laap/desktop run test:sorting
      - run: npm --workspace @laap/desktop run test:lease-exit
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace @laap/desktop run test:ui
      - run: npm audit --omit=dev

  desktop-core:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm --workspace @laap/desktop run build
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - if: runner.os == 'Windows'
        run: npm --workspace @laap/desktop run test:ui
