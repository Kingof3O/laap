name = "laap-billing-sandbox"
main = "apps/api/src/billing-worker.ts"
compatibility_date = "2026-08-31"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
PADDLE_MODE = "sandbox"
BILLING_LIVE_ENABLED = "false"

[env.production]
name = "laap-billing"

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.vars]
PADDLE_MODE = "live"
BILLING_LIVE_ENABLED = "false"
